{% extends "base.html" %}
{% block conteudo %}
<div class="row justify-content-center py-4 py-md-5">
    <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow auth-card">
            <div class="card-body p-4 p-md-5">
                <span class="badge text-bg-primary mb-3">Primeiro acesso</span>
                <h1 class="h2 fw-bold">Criar conta</h1>
                <p class="text-secondary">Cadastre um usuário para entrar no sistema.</p>
                <form method="post" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="nome">Nome</label>
                        <input class="form-control form-control-lg" id="nome" name="nome" type="text" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="email">E-mail</label>
                        <input class="form-control form-control-lg" id="email" name="email" type="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="senha">Senha</label>
                        <input class="form-control form-control-lg" id="senha" name="senha" type="password" minlength="6" required>
                        <div class="form-text">Utilize pelo menos 6 caracteres.</div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit">Criar conta</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">Já possui conta? <a href="{{ url_for('login') }}">Entrar</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
