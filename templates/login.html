{% extends "base.html" %}
{% block conteudo %}
<div class="row justify-content-center py-4 py-md-5">
    <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow auth-card">
            <div class="card-body p-4 p-md-5">
                <span class="badge text-bg-primary mb-3">Área protegida</span>
                <h1 class="h2 fw-bold">Entrar no sistema</h1>
                <p class="text-secondary">Informe seus dados para acessar os CRUDs e relatórios.</p>
                <form method="post" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="email">E-mail</label>
                        <input class="form-control form-control-lg" id="email" name="email" type="email" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="senha">Senha</label>
                        <input class="form-control form-control-lg" id="senha" name="senha" type="password" required>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
                </form>
                <p class="text-center text-secondary mt-4 mb-0">Ainda não possui conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
